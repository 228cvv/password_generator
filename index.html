<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Генератор паролей</h1>
        <div class="password-display">
            <div class="password-field">
                <span id="password-display" class="masked">••••••••</span>
                <button id="toggle-password" class="toggle-btn" title="Показать/скрыть пароль">
                    <span class="eye-icon">👁️</span>
                </button>
                <button id="copy-password" class="copy-btn" title="Скопировать пароль">
                    <span class="copy-icon">📋</span>
                </button>
            </div>
        </div>
        <div class="controls">
            <label for="length">Длина пароля:</label>
            <input type="number" id="length" min="4" max="64" value="8">
            <div class="options">
                <label><input type="checkbox" id="uppercase" checked> Заглавные буквы (A-Z)</label>
                <label><input type="checkbox" id="lowercase" checked> Строчные буквы (a-z)</label>
                <label><input type="checkbox" id="numbers" checked> Цифры (0-9)</label>
                <label><input type="checkbox" id="special" checked> Спец. символы (!@#$%^&*)</label>
            </div>
        </div>
        <button id="generate-btn" class="generate-btn">Сгенерировать пароль</button>
        <div id="message" class="message"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
